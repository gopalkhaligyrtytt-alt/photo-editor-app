<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photo Studio Pro</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
        h2 { color: #38bdf8; margin-top: 10px; }
        .upload-btn { background: #6366f1; color: white; padding: 12px 24px; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; }
        .canvas-card { width: 100%; max-width: 320px; margin: 20px auto; border: 2px dashed #334155; border-radius: 12px; overflow: hidden; background: #020617; }
        canvas { width: 100%; height: auto; display: block; }
        .controls { background: #1e293b; padding: 15px; border-radius: 16px; max-width: 320px; margin: 0 auto; text-align: left; }
        label { display: block; margin: 10px 0 4px; font-size: 12px; color: #cbd5e1; }
        input[type=range] { width: 100%; }
        .save-btn { width: 100%; background: #10b981; color: white; padding: 12px; font-weight: bold; border: none; border-radius: 10px; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>📸 Photo Studio Pro</h2>
    <input type="file" id="upload" accept="image/*" style="display:none;" onchange="loadImage(event)">
    <button class="upload-btn" onclick="document.getElementById('upload').click()">+ ছবি সিলেক্ট করুন</button>
    <div class="canvas-card"><canvas id="canvas"></canvas></div>
    <div class="controls">
        <label>ব্রাইটনেস (Brightness)</label>
        <input type="range" id="brightness" min="0" max="200" value="100" oninput="applyFilters()">
        <label>কনট্রাস্ট (Contrast)</label>
        <input type="range" id="contrast" min="0" max="200" value="100" oninput="applyFilters()">
        <label>ব্লার (Blur)</label>
        <input type="range" id="blur" min="0" max="10" value="0" oninput="applyFilters()">
        <label>ব্ল্যাক অ্যান্ড হোয়াইট (Grayscale)</label>
        <input type="range" id="gray" min="0" max="100" value="0" oninput="applyFilters()">
        <button class="save-btn" onclick="downloadImage()">ছবি সেভ করুন</button>
    </div>
    <script>
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let img = new Image();
        function loadImage(e) {
            let reader = new FileReader();
            reader.onload = function(event) {
                img.onload = function() { canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0); }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }
        function applyFilters() {
            if(!img.src) return;
            let b = document.getElementById('brightness').value;
            let c = document.getElementById('contrast').value;
            let bl = document.getElementById('blur').value;
            let g = document.getElementById('gray').value;
            ctx.filter = `brightness(${b}%) contrast(${c}%) blur(${bl}px) grayscale(${g}%)`;
            ctx.drawImage(img, 0, 0);
        }
        function downloadImage() {
            let link = document.createElement('a');
            link.download = 'edited-photo.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
