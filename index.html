<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Android Camera</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .viewport { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.05s linear; }
        .controls { height: 200px; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; justify-content: space-around; padding: 15px; }
        .row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .zoom-box { display: flex; align-items: center; gap: 8px; width: 55%; background: #111; padding: 6px 12px; border-radius: 20px; }
        .zoom-box input { width: 100%; accent-color: #f1c40f; }
        select, button { background: #222; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
        .btn-shutter { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; background: #e74c3c; cursor: pointer; }
    </style>
</head>
<body>

    <div class="viewport">
        <video id="cameraFeed" autoplay playsinline></video>
    </div>

    <div class="controls">
        <div class="row">
            <div class="zoom-box">
                <span style="font-size: 11px;">🔍 <b id="zoomText">1x</b></span>
                <input type="range" id="zoomSlider" min="1" max="10" step="0.1" value="1" oninput="updateZoom(this.value)">
            </div>
            
            <select id="modeSelect" onchange="applyMode()">
                <option value="none">Normal Mode</option>
                <option value="brightness(160%) contrast(120%)">Night Mode</option>
                <option value="contrast(130%) saturate(140%)">Vivid Mode</option>
                <option value="grayscale(100%)">B&W</option>
            </select>
        </div>

        <div class="row" style="justify-content: space-around;">
            <button onclick="switchCamera()">🔄 Flip</button>
            <button class="btn-shutter" onclick="takePhoto()"></button>
            <button onclick="alert('ভিডিও রেকর্ডিং মোড একটিভ!')">📹 Record</button>
        </div>
    </div>

    <canvas id="hdrCanvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('cameraFeed');
        const canvas = document.getElementById('hdrCanvas');
        let currentFacing = 'environment';

        function startCamera(facing) {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: facing }, 
                audio: false 
            })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("ক্যামেরা ওপেন করার পারমিশন প্রয়োজন!"); });
        }

        startCamera(currentFacing);

        function switchCamera() {
            currentFacing = (currentFacing === 'environment') ? 'user' : 'environment';
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            startCamera(currentFacing);
        }

        function updateZoom(val) {
            document.getElementById('zoomText').innerText = val + 'x';
            video.style.transform = `scale(${val})`;
        }

        function applyMode() {
            video.style.filter = document.getElementById('modeSelect').value;
        }

        function takePhoto() {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.filter = document.getElementById('modeSelect').value;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const link = document.createElement('a');
            link.href = canvas.toDataURL("image/png");
            link.download = `Camera_Photo.png`;
            link.click();
        }
    </script>
</body>
</html>
