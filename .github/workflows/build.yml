name: Build APK for Testing

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Build Cordova APK
      run: |
        cordova create app com.mycompany.photoeditor PhotoEditor
        cp index.html app/www/index.html
        cd app
        cordova platform add android
        cordova build android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-app-apk
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
